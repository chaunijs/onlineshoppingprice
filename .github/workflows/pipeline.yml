name: Online Price Scraper Pipeline

on:
  schedule:
    # Runs at 09:00 UTC on Monday (1), Wednesday (3), and Friday (5)
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tha

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & Patchright Browsers
        run: |
          playwright install chromium
          playwright install-deps
          patchright install chromium
          patchright install-deps

      - name: Run Sequential Orchestrator
        run: |
          python orchestrator.py

      - name: Set artifact name with execution day
        id: set_artifact_name
        run: |
          # Format: scraping-pipeline-outputs_YYYY-MM-DD (UTC date)
          EXEC_DATE=$(date -u +'%Y-%m-%d')
          ARTIFACT_NAME="scraping-pipeline-outputs_${EXEC_DATE}"
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

      - name: Archive Run Artifacts (Excel / Logs)
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_artifact_name.outputs.artifact_name }}
          path: py/output/
          retention-days: 7
