name: Online Price Scraper Pipeline

on:
  schedule:
    # Runs at 11:00 Thailand time (ICT) on Monday (1), Wednesday (3), and Friday (5)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & Patchright Browsers
        run: |
          playwright install chromium
          playwright install-deps
          patchright install chromium
          patchright install-deps

      - name: Run Sequential Orchestrator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python orchestrator.py

      - name: Set artifact name with execution day
        if: always()
        run: |
          echo "artifact_name=scraping-pipeline-outputs-$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Archive Run Artifacts (Excel / Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: py/scraper/output/
          retention-days: 7
