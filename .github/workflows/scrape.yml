name: Scheduled Retail Price Scraper

on:
  schedule:
    # 09:00 UTC = 16:00 (4:00 PM) Thailand Time
    - cron: '0 9 * * *'
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      # UPDATED to v4
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # UPDATED to v5
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System and Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          patchright install chromium

      - name: Run Sequential Orchestrator
        run: |
          python orchestrator.py

      # UPDATED to v4
      - name: Archive Run Artifacts (Excel / Logs)
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: scraping-pipeline-outputs
          path: py/output/
