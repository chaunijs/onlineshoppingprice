name: Big C Scraper (Tesseract OCR)

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  schedule:
    # Runs at 00:00 UTC every Monday, Wednesday, and Friday
    - cron: '0 9 * * 1,3,5' 

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tha

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright & Patchright Browsers
        run: |
          playwright install chromium
          playwright install-deps
          patchright install chromium
          patchright install-deps

      - name: Run Scraper
        run: python orchestrator.py

      - name: Upload Excel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scraped-excel-files
          path: '*.xlsx'
          retention-days: 7